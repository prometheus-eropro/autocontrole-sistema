<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>AutoControle — Sistema Profissional de Gestão Veicular</title>

<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-512.png">

<meta name="theme-color" content="#0f172a">

<link rel="stylesheet" href="css/style.css">

</head>

<body>

<header class="topbar">

<div class="topbar-left">

<img src="logo.png" class="topbar-logo">

<div>
<div class="empresa-nome">PROMETHEUS EROPRO</div>
<div class="sistema-nome">AutoControle — Sistema Profissional de Gestão Veicular</div>
<div style="font-size:18px">Tecnologia com ConsciêncIA gera resultado</div>
<div id="statusInternet"></div>
</div>

</div>

<div class="usuarioBox">
<div id="lojaLogada"></div>

<div class="usuarioInfo">
<span id="usuarioLogado"></span>
<span id="perfilLogado"></span>
</div>

<button onclick="logoutSistema()" class="btnLogout">Sair</button>
</div>

</header>

<div class="layout">

<aside class="sidebar">

<button id="menu_dashboard" onclick="abrirModulo('dashboard')">🏠 Início</button>
<button id="menu_veiculos" onclick="abrirModulo('veiculos')">🚗 Veículos</button>
<button id="menu_despesas" onclick="abrirModulo('despesas')">💰 Despesas</button>
<button id="menu_vendas" onclick="abrirModulo('vendas')">📝 Vendas</button>
<button id="menu_parcelas" onclick="abrirModulo('parcelas')">📆 Parcelas</button>
<button id="menu_estoque" onclick="abrirModulo('estoque')">📦 Estoque</button>
<button id="menu_financeiro" onclick="abrirModulo('financeiro')">📊 Financeiro</button>
<button id="menu_documentos" onclick="abrirModulo('documentos')">🖨 Documentos</button>

</aside>

<main class="main-content">
<div id="appStatus">Carregando sistema...</div>
<div id="conteudoModulo"></div>
</main>

</div>

<!-- scripts -->
<script src="js/api.js"></script>
<script src="js/helpers.js"></script>
<script src="js/auth.js"></script>
<script src="js/menu.js"></script>
<script src="js/modulos.js"></script>
<script src="js/estoque.js"></script>
<script src="js/veiculos.js"></script>
<script src="js/despesas.js"></script>
<script src="js/vendas.js"></script>
<script src="js/parcelas.js"></script>
<script src="js/financeiro.js"></script>
<script src="js/documentos.js"></script>
<script src="js/dashboard.js"></script>
<script src="js/master.js"></script>

<!-- 🔥 INICIALIZAÇÃO ÚNICA -->
<script>
window.addEventListener("load", function(){

  console.log("🚀 Sistema iniciando...");

  carregarSessao();
  atualizarStatusInternet();

  const perfil = (localStorage.getItem("perfil") || "").toUpperCase();
const cliente_id = localStorage.getItem("cliente_id");

  if(perfil === "MASTER" && !cliente_id){
    window.location.href = "master.html";
    return;
  }

  console.log("✅ CLIENTE ATIVO:", cliente_id);

  function limpar(v){
    return v ? v.replace(/"/g, "") : "";
  }

  document.getElementById("lojaLogada").innerText =
    limpar(localStorage.getItem("nome_loja"));

  document.getElementById("usuarioLogado").innerText =
    limpar(localStorage.getItem("nome_usuario"));

  document.getElementById("perfilLogado").innerText =
    limpar(localStorage.getItem("perfil"));

  aplicarPermissoesUI();
  

if(perfil === "ESTOQUE"){
  abrirModulo("estoque");
}else{
  abrirModulo("dashboard");
}

});
</script>
<nav class="mobile-nav">
  <button onclick="abrirModulo('dashboard')">🏠</button>
  <button onclick="abrirModulo('estoque')">📦</button>
  <button onclick="abrirModulo('vendas')">📝</button>
  <button onclick="abrirModulo('despesas')">💰</button>
  <button onclick="abrirModulo('financeiro')">📊</button>
</nav>
</body>
</html>
