<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoControle — Login</title>

  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-512.png">
  <meta name="theme-color" content="#0f172a">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

  <div class="login-shell">
    <div class="login-card">
      <img src="logo.png" alt="Logo PROMETHEUS EROPRO" class="login-logo">

      <h1 class="login-title">AutoControle</h1>
      <div class="login-subtitle">Sistema Profissional de Gestão Veicular</div>
      <div class="login-slogan">Tecnologia com ConsciêncIA gera resultado.</div>

      <input id="login_cliente" placeholder="Cliente ID">     
      <input id="login_usuario" placeholder="Usuário">
      <input id="login_senha" type="password" placeholder="Senha">

      <button class="btn-primary" onclick="fazerLogin()">Entrar no Sistema</button>

      <div class="login-footer">
        <strong>PROMETHEUS EROPRO</strong><br>
        Edgar Rocha Oliveira
      </div>
    </div>
  </div>

<script src="js/helpers.js"></script>
<script src="js/api.js"></script>

  <script src="js/auth.js"></script>
<script src="js/master.js"></script>
</body>
</html>
