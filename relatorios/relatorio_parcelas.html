<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Relatório de Parcelas</title>

  <!-- IMPORTANTE -->
<script src="../js/helpers.js"></script>
<script src="../js/api.js"></script>
<script src="../js/parcelas.js"></script>

</head>

<body>


<h2>Relatório de Parcelas</h2>

<select id="filtroStatus" onchange="filtrarStatusAPI()">
  <option value="TODOS">Todos</option>
  <option value="PAGO">Pago</option>
  <option value="PENDENTE">Pendente</option>
  <option value="VENCIDA">Vencida</option>
</select>

<table border="1" width="100%">
<thead>
<tr>
<th>Cliente</th>
<th>Placa</th>
<th>Parcela</th>
<th>Valor</th>
<th>Vencimento</th>
<th>Status</th>
</tr>
</thead>

<tbody id="tb_parcelas">
<tr>
<td colspan="6" align="center">Carregando...</td>
</tr>
</tbody>

</table>

<script>
document.addEventListener("DOMContentLoaded", function () {
  carregarParcelas("TODOS", "RELATORIO");
});

function filtrarStatusAPI(){

  const status = document.getElementById("filtroStatus").value;

  carregarParcelas(status);

}
</script>

</body>
</html>
