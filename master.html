<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Master - AutoControle</title>

<link rel="stylesheet" href="css/style.css">

<style>

body{
  background: linear-gradient(135deg, #e0f2fe, #dbeafe);
  font-family: Arial;
  margin:0;
  padding:20px;
  max-width: 1200px;
margin: auto;
}

/* CARDS */
.card{
  background:#ffffff;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  color:#1e293b;
  box-shadow:0 4px 20px rgba(0,0,0,0.08);
}
.card h2{
  color:#1d4ed8;
}
/* INPUTS */
input, select{
  padding:10px;
  border-radius:8px;
  border:1px solid #cbd5e1;
  background:#f8fafc;
  color:#1e293b;
}

/* BOTÃO PRINCIPAL */
.btn-primary{
  background:#3b82f6;
  color:#fff;
  border:none;
  padding:10px 15px;
  border-radius:8px;
  cursor:pointer;
}

.btn-primary:hover{
  background:#2563eb;
}

/* BOTÕES SECUNDÁRIOS */
button{
  padding:8px 12px;
  border-radius:8px;
  border:1px solid #cbd5e1;
  background:#f1f5f9;
  cursor:pointer;
}

button:hover{
  background:#e2e8f0;
}

</style>

</head>

<body>

<div class="card">

  <h2>Painel Master — Nova Loja</h2>
  <small>Cadastro de nova empresa cliente do AutoControle</small>

  <div class="grid">
    <input id="nova_loja_nome" placeholder="Nome da Loja">
    <input id="novo_nome_proprietario" placeholder="Nome do Proprietário">
    <input id="novo_cnpj" placeholder="CNPJ da Loja">
    <input id="novo_ie" placeholder="Inscrição Estadual">
  </div>

  <div class="grid">
    <input id="novo_telefone" placeholder="Telefone da Loja">
    <input id="novo_email" placeholder="E-mail da Loja">
    <input id="nova_cidade" placeholder="Cidade">
    <input id="novo_estado" placeholder="UF">
  </div>

  <div class="grid">
    <input id="novo_endereco" placeholder="Endereço Completo">
    <input id="novo_valor_mensal" placeholder="Valor Mensal do Sistema">
    <select id="novo_plano">
      <option value="COMPLETO">Plano Completo</option>
    </select>
  </div>

  <hr>

  <h3>Usuário inicial da loja</h3>

  <div class="grid">
    <input id="novo_usuario" placeholder="Usuário Proprietário">
    <input id="nova_senha" placeholder="Senha Inicial">
  </div>

  <div class="grid">
    <button onclick="criarNovaLoja()" class="btn-primary">Criar Loja</button>
    <button onclick="gerarContratoNovaLoja()" class="btn-primary">Gerar Contrato</button>
    <button onclick="abrirBackups()" class="btn-primary">Abrir Backups</button>
  </div>

</div>

<div class="card">

  <h2>Empresas Cadastradas</h2>

  <button onclick="listarEmpresas()" class="btn-primary">
    🔄 Atualizar lista
  </button>

  <div id="lista_empresas"></div>

</div>

<!-- 🔐 MODAL SENHA -->
<div id="modalSenha" style="display:none; position:fixed; top:20%; left:50%; transform:translateX(-50%);
background:#fff; padding:20px; border-radius:10px; box-shadow:0 0 10px rgba(0,0,0,.3);">

  <h3>Alterar Senha</h3>

  <input id="senha_usuario_alvo" type="hidden">
  <input id="nova_senha_master" placeholder="Nova senha">

  <br><br>

  <button onclick="confirmarTrocaSenha()">Salvar</button>
  <button onclick="fecharModalSenha()">Cancelar</button>

</div>

<button onclick="salvarTeste()">TESTE SIMPLES</button>

<!-- 🔥 SCRIPTS -->
<script src="js/helpers.js"></script>
<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/master.js"></script>


<button onclick="logout()" style="position:fixed; top:10px; right:10px;">
  🚪 Sair
</button>

<script>
window.onload = function(){

  const perfil = (localStorage.getItem("perfil") || "").toUpperCase();

  if(perfil === "MASTER"){
  localStorage.removeItem("cliente_id");
  localStorage.removeItem("nome_loja");
  // NÃO remove nome_usuario
}

  listarEmpresas();
}

function abrirBackups(){
  api("getLinkBackup", {}, (res)=>{
    if(res.ok){
      window.open(res.url, "_blank");
    }
  });
}


</script>

</body>
</html>
