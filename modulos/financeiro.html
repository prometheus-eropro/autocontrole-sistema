<div class="card">

<h2>DRE Completa</h2>

<h3>Estoque (Informativo)</h3>

<div class="grid">

<div>
<label>Capital em Estoque</label>
<input id="capitalEstoque" readonly>
</div>

<div>
<label>Despesas Veículos em Estoque</label>
<input id="despesasEstoque" readonly>
</div>

<div>
<label>Quantidade Veículos Estoque</label>
<input id="qtdEstoque" readonly>
</div>

</div>


<h3>Resultado Real (Veículos Vendidos)</h3>

<div class="grid">
<input type="date" id="filtro_inicio">
<input type="date" id="filtro_fim">
<button onclick="carregarFinanceiro()">Filtrar</button>
<div>
<label>Total Vendas</label>
<input id="totalVendas" readonly>
</div>

<div>
<label>Custo Compra Vendidos</label>
<input id="custoCompraVendidos" readonly>
</div>

<div>
<label>Despesas Veículos Vendidos</label>
<input id="despesasVendidos" readonly>
</div>

<div>
<label>Despesas Operacionais</label>
<input id="despesasOperacionais" readonly>
</div>

<div>
<label>Lucro Final</label>
<input id="lucroFinal" readonly>
</div>

</div>

</div>
